services:
  - type: web
    name: decisiontwin-ui
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: VITE_FASTAPI_URL
        sync: false
      - key: VITE_EXPRESS_API_URL
        value: ""
